name: Build and Test

on:
  - push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # Push documentation to GH Pages

jobs:
  test:
    runs-on: [self-hosted, public-release]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        id: install-rust
        with:
          # Pinned to v1, whose action.yml declares `toolchain` as required with no
          # default. The `@stable` ref exists only to supply this default, and its
          # commit is outside master's history, so it would eventually be
          # garbage-collected. Pass the input instead.
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-hack
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          # Same reasoning as above: the `@cargo-hack` ref only adds this default.
          tool: cargo-hack

      - name: Run tests
        run: cargo hack test --feature-powerset --skip default --mutually-exclusive-features aws_ecs,gcp_gke

      - name: Lint
        run: |
          cargo fmt --check --package komoju-datadog
          cargo clippy -F aws_ecs,axum,sqlx -- -D warnings 

      - name: Build docs
        run: |
          cargo doc --no-deps -F aws_ecs,axum,sqlx
        env:
          RUSTDOCFLAGS: -D warnings
