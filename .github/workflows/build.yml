name: Build and Test

on:
  - push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # Push documentation to GH Pages

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        id: install-rust
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-hack
        uses: taiki-e/install-action@4539fbd5b081ee3140d35280107f6a564c8c849a # cargo-hack

      - name: Run tests
        run: cargo hack test --feature-powerset --skip default --mutually-exclusive-features aws_ecs,gcp_gke

      - name: Lint
        run: |
          cargo fmt --check --package komoju-datadog
          cargo clippy -F aws_ecs,axum,sqlx -- -D warnings 

      - name: Build docs
        run: |
          cargo doc --no-deps -F aws_ecs,axum,sqlx
        env:
          RUSTDOCFLAGS: -D warnings
