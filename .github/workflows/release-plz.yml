name: Release-plz

on:
  push:
    branches:
      - main

jobs:

  # Publish unpublished versions to crates.io, then push the tag and open the
  # GitHub release for them.
  release-plz-release:
    name: Release-plz release
    runs-on: [self-hosted, public-release]
    if: ${{ github.repository_owner == 'komoju' }}
    permissions:
      contents: write # Push the tag and create the GitHub release
      pull-requests: read # Detect the release PR and its commits
    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: release-plz resolves the released commit and builds the
          # changelog from the commits since the last release.
          fetch-depth: 0
          persist-credentials: false
      - &install-rust
        name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          # v1 requires this input explicitly; see build.yml.
          toolchain: stable
      - name: Run release-plz
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Scoped crates.io token (`publish-update`, crate `komoju-datadog`). When set,
          # release-plz uses it for `cargo publish` instead of attempting OIDC.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Open or update the PR that bumps the version and adds the changelog entry.
  release-plz-pr:
    name: Release-plz PR
    runs-on: [self-hosted, public-release]
    if: ${{ github.repository_owner == 'komoju' }}
    permissions:
      contents: write # Push the release branch
      pull-requests: write # Open and update the release PR
    # Serialize runs for the same branch: the release PR branch must not be
    # rewritten by two runs at once. Never cancel, or a release could be skipped.
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - *checkout
      - *install-rust
      - name: Run release-plz
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}